version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: paypulse_postgres
    environment:
      POSTGRES_DB: paypulse_db
      POSTGRES_USER: paypulse_user
      POSTGRES_PASSWORD: paypulse_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U paypulse_user -d paypulse_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: paypulse_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
